<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Subrata Manna — researcher in algebraic geometry, linear codes, and code-based cryptography.">

    <title>{{ page.title }} | Subrata Manna - Academic Homepage</title>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --ink: #0f172a;
            --text: #334155;
            --muted: #64748b;
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #eef2ff;
            --teal: #0d9488;
            --pink: #e11d48;
            --gold: #d97706;
            --page: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
            --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
            --shadow-hover: 0 20px 35px -10px rgba(15, 23, 42, 0.08), 0 8px 16px -4px rgba(15, 23, 42, 0.04);
            --radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            background: var(--page);
            font-size: 16px;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        a:hover { color: var(--primary-dark); }
        img { max-width: 100%; height: auto; display: block; }

        /* NAVBAR */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 18px;
            width: 100%;
            padding: 16px clamp(20px, 5vw, 80px);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--ink);
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.02em;
        }
        .logo-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
        }
        .nav-links a {
            padding: 8px 16px;
            border-radius: 999px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
        }
        .nav-links a:hover {
            color: var(--ink);
            background: rgba(238, 242, 255, 0.6);
        }
        .nav-links a.active {
            color: var(--primary);
            background: var(--primary-light);
            font-weight: 700;
        }

        /* LAYOUT CONTAINER */
        .container {
            display: grid;
            grid-template-columns: minmax(260px, 310px) minmax(0, 1fr);
            align-items: start;
            gap: clamp(28px, 4vw, 56px);
            max-width: 1240px;
            margin: 40px auto 60px;
            padding: 0 24px;
        }

        /* SIDEBAR */
        .sidebar {
            position: sticky;
            top: 96px;
            padding: 32px 24px;
            text-align: center;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: box-shadow 0.3s ease;
        }
        
        /* FIXED: Profile image sizing & sharp rendering */
        .profile-image {
            width: 170px;
            height: 170px;
            max-width: 100%;
            aspect-ratio: 1 / 1;
            display: block;
            margin: 0 auto 20px;
            object-fit: cover;
            object-position: center;
            border-radius: 50%;
            border: 4px solid var(--white);
            outline: 3px solid var(--primary-light);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            flex-shrink: 0;
            image-rendering: -webkit-optimize-contrast;
        }

        .sidebar h1 {
            margin-bottom: 8px;
            color: var(--ink);
            font-size: 24px;
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: -0.02em;
        }
        .position {
            display: inline-block;
            margin-bottom: 14px;
            padding: 4px 14px;
            color: var(--primary-dark);
            background: var(--primary-light);
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
        }
        .university { 
            color: var(--muted); 
            font-size: 13.5px; 
            line-height: 1.6; 
            font-weight: 500;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        .social-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            font-size: 18px;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .social-icons a:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
        }
        .email-link { color: var(--pink); background: #fff1f2; }
        .scholar-link { color: #2563eb; background: #eff6ff; }
        .researchgate-link { color: #0d9488; background: #ccfbf1; }
        .linkedin-link { color: #0284c7; background: #e0f2fe; }

        /* MAIN CONTENT STYLES */
        .main-content { min-width: 0; padding: 4px 0; }
        
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            color: var(--primary);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .eyebrow::before {
            content: "";
            width: 20px;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
        }
        
        .main-content h2 {
            margin-bottom: 20px;
            color: var(--ink);
            font-size: clamp(28px, 3.5vw, 36px);
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.03em;
        }
        .main-content p { 
            margin-bottom: 18px; 
            color: var(--text); 
            font-size: 16px; 
            line-height: 1.85; 
        }

        /* CARDS & LISTS */
        .details { 
            display: grid; 
            grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); 
            gap: 24px; 
            margin-top: 36px; 
        }
        .details section { 
            padding: 26px; 
            background: var(--white); 
            border: 1px solid var(--border); 
            border-radius: 18px; 
            box-shadow: var(--shadow-sm);
        }
        .details h3 { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 18px; 
            color: var(--ink);
            font-size: 18px; 
            font-weight: 700; 
        }
        .heading-icon { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            width: 36px; 
            height: 36px; 
            color: var(--primary); 
            background: var(--primary-light); 
            border-radius: 10px; 
            font-size: 15px;
        }

        .interests-list { list-style: none; }
        .interests-list li { 
            position: relative; 
            padding: 6px 0 6px 28px; 
            color: var(--text); 
            font-size: 14.5px; 
            font-weight: 500;
        }
        .interests-list li::before { 
            content: "\f00c"; 
            position: absolute; 
            top: 11px; 
            left: 0; 
            width: 17px; 
            height: 17px; 
            color: var(--white); 
            background: var(--primary); 
            border-radius: 50%; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            font-family: "Font Awesome 6 Free"; 
            font-size: 9px; 
            font-weight: 900; 
        }

        .education-list { list-style: none; }
        .education-list li { 
            display: flex; 
            gap: 14px; 
            margin-bottom: 18px; 
            font-size: 14px; 
            font-weight: 700; 
            color: var(--ink);
        }
        .education-icon { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            width: 36px; 
            height: 36px; 
            color: var(--primary); 
            background: var(--primary-light); 
            border-radius: 10px; 
            flex-shrink: 0; 
        }
        .education-list small { 
            display: block; 
            margin-top: 2px; 
            color: var(--muted); 
            font-size: 12.5px; 
            font-weight: 500; 
        }

        .publication { 
            position: relative; 
            margin: 16px 0; 
            padding: 24px; 
            background: var(--white); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            box-shadow: var(--shadow-sm);
            transition: all 0.25s ease;
        }
        .publication:hover {
            border-color: #cbd5e1;
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }
        .publication h3 { 
            max-width: calc(100% - 35px); 
            margin-bottom: 8px; 
            color: var(--ink);
            font-size: 17px; 
            font-weight: 700; 
            line-height: 1.4;
        }
        .publication p { 
            margin-bottom: 10px; 
            color: var(--muted); 
            font-size: 14px; 
        }
        .publication-link { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            color: var(--primary); 
            font-size: 13.5px; 
            font-weight: 700; 
        }
        .publication-icon { 
            position: absolute; 
            top: 24px; 
            right: 24px; 
            color: #cbd5e1; 
            font-size: 18px; 
        }

        .teaching-list { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
        .teaching-item { 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            padding: 16px 20px; 
            background: var(--white); 
            border: 1px solid var(--border); 
            border-radius: 14px; 
            font-size: 15px;
            font-weight: 600; 
            color: var(--ink);
        }
        .subject-tag { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
        .tag-blue { background-color: #3b82f6; }
        .tag-green { background-color: #10b981; }

        .contact-card { 
            display: flex; 
            align-items: flex-start; 
            gap: 16px; 
            margin: 16px 0; 
            padding: 22px; 
            background: var(--white); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            box-shadow: var(--shadow-sm);
        }
        .contact-icon { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            width: 44px; 
            height: 44px; 
            color: var(--pink); 
            background: #fff1f2; 
            border-radius: 12px; 
            font-size: 18px;
            flex-shrink: 0; 
        }
        .contact-icon.location { color: var(--teal); background: #ccfbf1; }

        footer { 
            margin-top: 60px; 
            padding: 32px 20px; 
            color: var(--muted); 
            border-top: 1px solid var(--border); 
            font-size: 14px; 
            text-align: center; 
            background: var(--white);
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 960px) {
            .navbar { flex-direction: column; align-items: flex-start; padding: 16px 20px; }
            .nav-links { flex-wrap: wrap; width: 100%; gap: 2px; }
            .container { grid-template-columns: 1fr; margin-top: 24px; }
            .sidebar { position: static; max-width: 480px; margin: 0 auto 10px; }
            .details { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <a href="{{ site.baseurl }}/" class="logo">
            <span class="logo-dot"></span>
            DR. SUBRATA MANNA
        </a>
        <nav aria-label="Main navigation">
            <ul class="nav-links">
                <li><a href="{{ site.baseurl }}/" class="{% if page.url == '/' %}active{% endif %}">Home</a></li>
                <li><a href="{{ site.baseurl }}/publications" class="{% if page.url contains 'publications' %}active{% endif %}">Publications</a></li>
                <li><a href="{{ site.baseurl }}/posts" class="{% if page.url contains 'posts' %}active{% endif %}">Posts</a></li>
                <li><a href="{{ site.baseurl }}/talks" class="{% if page.url contains 'talks' %}active{% endif %}">Talks &amp; Conferences</a></li>
                <li><a href="{{ site.baseurl }}/teaching" class="{% if page.url contains 'teaching' %}active{% endif %}">Teaching</a></li>
                <li><a href="{{ site.baseurl }}/contact" class="{% if page.url contains 'contact' %}active{% endif %}">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="container">
        <!-- PERSISTENT SIDEBAR -->
        <aside class="sidebar">
            <img src="{{ site.baseurl }}/Profile.jpg" alt="Subrata Manna" class="profile-image">
            <h1>Subrata Manna</h1>
            <p class="position">Postdoctoral Fellow</p>
            <p class="university">Indian Institute of Technology Bombay<br>Department of Mathematics</p>

            <div class="social-icons">
                <a href="mailto:subrata147314@gmail.com" class="email-link" title="Email"><i class="fa-solid fa-envelope"></i></a>
                <a href="https://scholar.google.com/citations?user=QNPl6CkAAAAJ&hl=en" class="scholar-link" target="_blank" rel="noopener" title="Google Scholar"><i class="fa-brands fa-google-scholar"></i></a>
                <a href="https://www.researchgate.net/profile/Subrata-Manna-6" class="researchgate-link" target="_blank" rel="noopener" title="ResearchGate"><i class="fa-brands fa-researchgate"></i></a>
                <a href="https://www.linkedin.com/in/subrata-manna-4418bb362/" class="linkedin-link" target="_blank" rel="noopener" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
            </div>
        </aside>

        <!-- PAGE CONTENT INJECTED HERE -->
        <div class="main-content">
            {{ content }}
        </div>
    </main>

    <footer>
        <p>&copy; {{ 'now' | date: "%Y" }} Subrata Manna. All rights reserved.</p>
    </footer>

</body>
</html>
