<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Subrata Manna — researcher in algebraic geometry, linear codes, and code-based cryptography.">

    <title>{{ page.title }} | Subrata Manna</title>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --ink: #172033;
            --text: #465168;
            --muted: #778197;
            --primary: #5869b7;
            --primary-dark: #3f5097;
            --primary-light: #eef0ff;
            --teal: #159d8c;
            --pink: #d94f70;
            --gold: #e4a23b;
            --page: #f7f8fc;
            --white: #ffffff;
            --border: #e7eaf2;
            --shadow: 0 12px 35px rgba(30, 43, 82, 0.06);
            --radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: "Inter", "Lato", Arial, sans-serif;
            color: var(--ink);
            background: var(--page);
            font-size: 16px;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
        }
        a:hover { color: var(--primary-dark); }
        img { max-width: 100%; }

        /* NAVBAR */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 18px;
            width: 100%;
            padding: 16px clamp(20px, 4vw, 60px);
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            color: var(--ink);
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.04em;
        }
        .logo-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 0 5px var(--primary-light);
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 5px;
            list-style: none;
        }
        .nav-links a {
            padding: 8px 14px;
            border-radius: 999px;
            color: #475168;
            font-size: 13px;
            font-weight: 700;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary-dark);
            background: var(--primary-light);
        }

        /* LAYOUT CONTAINER */
        .container {
            display: grid;
            grid-template-columns: minmax(250px, 320px) minmax(0, 1fr);
            align-items: start;
            gap: clamp(30px, 5vw, 65px);
            max-width: 1220px;
            margin: 42px auto 35px;
            padding: 0 25px;
        }

        /* SIDEBAR */
        .sidebar {
            position: sticky;
            top: 110px;
            padding: 32px 23px;
            text-align: center;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .profile-image {
            width: 185px;
            height: 185px;
            margin: 0 auto 22px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid #f0f2ff;
            box-shadow: 0 0 0 1px #dce1fb;
        }
        .sidebar h1 {
            margin-bottom: 12px;
            font-size: 29px;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.04em;
        }
        .position {
            display: inline-block;
            margin-bottom: 15px;
            padding: 5px 13px;
            color: var(--primary-dark);
            background: var(--primary-light);
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
        }
        .university { color: var(--muted); font-size: 14px; line-height: 1.8; }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 27px;
        }
        .social-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 14px;
            font-size: 21px;
        }
        .social-icons a:hover { transform: translateY(-4px); }
        .email-link { color: #d94f70; background: #fff0f3; }
        .scholar-link { color: #4285f4; background: #edf4ff; }
        .researchgate-link { color: #00a99d; background: #e8fbf8; }
        .linkedin-link { color: #0a66c2; background: #eaf4ff; }

        /* MAIN CONTENT STYLES */
        .main-content { min-width: 0; padding: 12px 0; }
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 12px;
            color: var(--primary);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        .eyebrow::before {
            content: "";
            width: 25px;
            height: 2px;
            background: var(--primary);
        }
        .main-content h2 {
            margin-bottom: 23px;
            font-size: clamp(32px, 4vw, 42px);
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.04em;
        }
        .main-content p { margin-bottom: 17px; color: var(--text); font-size: 16px; line-height: 1.95; }

        /* CARDS & LISTS */
        .details { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 22px; margin-top: 35px; }
        .details section { padding: 24px; background: var(--white); border: 1px solid var(--border); border-radius: 18px; }
        .details h3 { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; font-size: 19px; font-weight: 800; }
        .heading-icon { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; color: var(--primary); background: var(--primary-light); border-radius: 11px; }

        .interests-list { list-style: none; }
        .interests-list li { position: relative; padding: 5px 0 5px 26px; color: var(--text); font-size: 14px; }
        .interests-list li::before { content: "\f00c"; position: absolute; top: 10px; left: 0; width: 16px; height: 16px; color: white; background: var(--primary); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: "Font Awesome 6 Free"; font-size: 8px; font-weight: 900; }

        .education-list { list-style: none; }
        .education-list li { display: flex; gap: 11px; margin-bottom: 17px; font-size: 13px; font-weight: 700; }
        .education-icon { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; color: #596ab9; background: #eef0ff; border-radius: 11px; flex-shrink: 0; }
        .education-list small { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 400; }

        .publication { position: relative; margin: 15px 0; padding: 22px 24px; background: var(--white); border: 1px solid var(--border); border-radius: 16px; }
        .publication h3 { max-width: calc(100% - 35px); margin-bottom: 8px; font-size: 17px; font-weight: 700; }
        .publication p { margin-bottom: 8px; color: var(--muted); font-size: 14px; }
        .publication-link { display: inline-flex; align-items: center; gap: 8px; color: var(--primary); font-size: 13px; font-weight: 800; }
        .publication-icon { position: absolute; top: 23px; right: 22px; color: #bdc6ed; font-size: 20px; }

        .teaching-list { display: flex; flex-direction: column; gap: 14px; margin-top: 15px; }
        .teaching-item { display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: var(--white); border: 1px solid var(--border); border-radius: 14px; font-weight: 600; }
        .subject-tag { width: 8px; height: 8px; border-radius: 50%; }
        .tag-blue { background-color: #4a90e2; }
        .tag-green { background-color: #43a77a; }

        .contact-card { display: flex; align-items: flex-start; gap: 14px; margin: 14px 0; padding: 20px; background: var(--white); border: 1px solid var(--border); border-radius: 14px; }
        .contact-icon { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; color: var(--pink); background: #fff0f3; border-radius: 13px; flex-shrink: 0; }
        .contact-icon.location { color: var(--teal); background: #e8fbf8; }

        footer { margin-top: 35px; padding: 28px 20px; color: var(--muted); border-top: 1px solid var(--border); font-size: 13px; text-align: center; }

        @media (max-width: 1000px) {
            .navbar { flex-direction: column; align-items: flex-start; }
            .container { grid-template-columns: 1fr; }
            .sidebar { position: static; max-width: 500px; margin: 0 auto; }
            .details { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <a href="{{ site.baseurl }}/" class="logo">
            <span class="logo-dot"></span>
            DR. SUBRATA MANNA
        </a>
        <nav aria-label="Main navigation">
            <ul class="nav-links">
                <li><a href="{{ site.baseurl }}/" class="{% if page.url == '/' %}active{% endif %}">Home</a></li>
                <li><a href="{{ site.baseurl }}/publications" class="{% if page.url contains 'publications' %}active{% endif %}">Publications</a></li>
                <li><a href="{{ site.baseurl }}/posts" class="{% if page.url contains 'posts' %}active{% endif %}">Posts</a></li>
                <li><a href="{{ site.baseurl }}/talks" class="{% if page.url contains 'talks' %}active{% endif %}">Talks</a></li>
                <li><a href="{{ site.baseurl }}/teaching" class="{% if page.url contains 'teaching' %}active{% endif %}">Teaching</a></li>
                <li><a href="{{ site.baseurl }}/contact" class="{% if page.url contains 'contact' %}active{% endif %}">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="container">
        <!-- PERSISTENT SIDEBAR -->
        <aside class="sidebar">
            <img src="{{ site.baseurl }}/Profile.jpg" alt="Subrata Manna" class="profile-image">
            <h1>Subrata Manna</h1>
            <p class="position">Postdoctoral Fellow</p>
            <p class="university">Indian Institute of Technology Bombay<br>Department of Mathematics</p>

            <div class="social-icons">
                <a href="mailto:subrata147314@gmail.com" class="email-link" title="Email"><i class="fa-solid fa-envelope"></i></a>
                <a href="https://scholar.google.com/citations?user=QNPl6CkAAAAJ&hl=en" class="scholar-link" target="_blank" rel="noopener" title="Google Scholar"><i class="fa-brands fa-google-scholar"></i></a>
                <a href="https://www.researchgate.net/profile/Subrata-Manna-6" class="researchgate-link" target="_blank" rel="noopener" title="ResearchGate"><i class="fa-brands fa-researchgate"></i></a>
                <a href="https://www.linkedin.com/in/subrata-manna-4418bb362/" class="linkedin-link" target="_blank" rel="noopener" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
            </div>
        </aside>

        <!-- PAGE CONTENT INJECTED HERE -->
        <div class="main-content">
            {{ content }}
        </div>
    </main>

    <footer>
        <p>&copy; {{ 'now' | date: "%Y" }} Subrata Manna. All rights reserved.</p>
    </footer>

</body>
</html>
