<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Website</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: var(--card);
      padding: 2.5rem;
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 { margin-bottom: 0.5rem; color: var(--accent); }
    p { line-height: 1.6; color: #94a3b8; }
    .links { margin-top: 1.5rem; display: flex; justify-content: center; gap: 1rem; }
    .links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 6px;
      transition: all 0.2s;
    }
    .links a:hover {
      background: var(--accent);
      color: var(--bg);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, I'm [Subrata Manna]</h1>
    <p>Welcome to my personal site hosted on GitHub Pages. I build projects, write code, and share insights.</p>
    <div class="links">
      <a href="https://github.com/mathsubrata" target="_blank">GitHub</a>
      <a href="mailto:subrata147314@gmail.com">Contact</a>
    </div>
  </div>
</body>
</html>
